services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ritm
      POSTGRES_USER: ritm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ritm -d ritm]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ritm-app:local
    build: .
    env_file: .env
    command: [npm, run, db:migrate]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: ritm-app:local
    build: .
    env_file: .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  reminders:
    image: ritm-app:local
    build: .
    env_file: .env
    command: [npm, run, reminders]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
